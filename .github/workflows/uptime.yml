name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Проверка сайта и бота
        id: check
        run: |
          set +e

          site=$(curl -sS -o /tmp/site.html -w '%{http_code}' --max-time 20 \
            "https://mediahubpro.ru/?nocache=$RANDOM" || echo ERR)
          if ! grep -qi "MediaHub" /tmp/site.html 2>/dev/null; then
            site="BAD_BODY"
          fi

          # heartbeat читаем напрямую с origin, в обход Cloudflare
          health=$(curl -sS --max-time 20 \
            --resolve "mediahubpro.ru:443:171.22.114.76" \
            "https://mediahubpro.ru/health.txt?nocache=$RANDOM" || echo ERR)

          now=$(date +%s)
          ts=$(printf '%s' "$health" | sed -n 's/.*"ts":\([0-9][0-9]*\).*/\1/p')
          bot=$(printf '%s' "$health" | sed -n 's/.*"bot":"\([^"]*\)".*/\1/p')
          age=-1
          if [ -n "$ts" ]; then age=$((now - ts)); fi

          ok=1
          [ "$site" = "200" ] || ok=0
          [ "$bot" = "active" ] || ok=0
          if [ "$age" -lt 0 ] || [ "$age" -gt 300 ]; then ok=0; fi

          echo "site=$site bot=$bot age=${age}s ok=$ok"
          {
            echo "ok=$ok"
            echo "site=$site"
            echo "bot=$bot"
            echo "age=$age"
          } >> "$GITHUB_OUTPUT"

      - name: Алерты (Telegram + GitHub issue)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OK: ${{ steps.check.outputs.ok }}
          SITE: ${{ steps.check.outputs.site }}
          BOT: ${{ steps.check.outputs.bot }}
          AGE: ${{ steps.check.outputs.age }}
          TEST: ${{ inputs.test_alert }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = os.environ["REPO"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}"
          token = os.environ.get("TOKEN", "")
          chat = os.environ.get("CHAT", "")
          gh_token = os.environ.get("GH_TOKEN", "")

          ok = os.environ.get("OK") == "1"
          test = os.environ.get("TEST", "").lower() == "true"
          site = os.environ.get("SITE", "?")
          bot = os.environ.get("BOT", "?")
          age = os.environ.get("AGE", "?")

          def send_telegram(text):
              if not token or not chat:
                  print("telegram: secrets missing")
                  return
              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      res = json.load(r)
                      print("telegram ok:", res.get("ok"), "message_id:", res.get("result", {}).get("message_id"))
              except Exception as e:
                  print("telegram failed:", type(e).__name__, str(e)[:200])

          def gh(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def open_issues():
              try:
                  return [
                      i for i in gh("GET", "/issues?state=open&per_page=50")
                      if i.get("title", "").startswith("🔴 MediaHub Pro")
                  ]
              except Exception as e:
                  print("issue lookup failed:", type(e).__name__)
                  return []

          def create_issue():
              try:
                  gh("POST", "/issues", {
                      "title": "🔴 MediaHub Pro недоступен",
                      "body": (
                          "@ArtLine-boss\n\n"
                          f"- Сайт: `{site}`\n"
                          f"- Бот: `{bot}`\n"
                          f"- Heartbeat: {age} с назад\n\n"
                          f"[Детали проверки]({run_url})"
                      ),
                  })
                  print("issue created")
              except Exception as e:
                  print("issue create failed:", type(e).__name__, str(e)[:200])

          def close_issues(issues):
              for i in issues:
                  try:
                      gh("POST", f"/issues/{i['number']}/comments", {
                          "body": "🟢 MediaHub Pro снова работает: сайт и бот отвечают."
                      })
                      gh("PATCH", f"/issues/{i['number']}", {"state": "closed"})
                      print("issue closed:", i["number"])
                  except Exception as e:
                      print("issue close failed:", type(e).__name__)

          if test:
              send_telegram(
                  "🧪 <b>Мониторинг MediaHub Pro подключён</b>\n"
                  "Проверки каждые 5 минут. Если сервер или бот упадут — придёт сообщение сюда."
              )
              raise SystemExit(0)

          # состояние предыдущей завершённой проверки — чтобы не спамить
          prev = None
          try:
              runs = gh("GET", "/actions/workflows/uptime.yml/runs?status=completed&per_page=1")
              wr = runs.get("workflow_runs", [])
              if wr:
                  prev = wr[0].get("conclusion")
          except Exception as e:
              print("previous run lookup failed:", type(e).__name__)

          if not ok and prev != "failure":
              send_telegram(
                  "🔴 <b>MediaHub Pro недоступен</b>\n"
                  f"Сайт: {site}\nБот: {bot}\nHeartbeat: {age} с назад\n"
                  f"<a href=\"{run_url}\">Детали проверки</a>"
              )
              if not open_issues():
                  create_issue()
          elif ok and prev == "failure":
              send_telegram("🟢 <b>MediaHub Pro снова работает</b>\nСайт и бот отвечают.")
              close_issues(open_issues())
          else:
              print(f"state unchanged, no alert (ok={ok}, prev={prev})")
              if not ok and not open_issues():
                  create_issue()
          PY
