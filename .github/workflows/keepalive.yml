name: keepalive

# GitHub отключает scheduled workflows в публичных репозиториях
# после 60 дней без коммитов. Раз в месяц делаем пустой коммит.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить отметку
        run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
